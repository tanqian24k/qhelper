<!DOCTYPE html>
<!--
  ═══════════════════════════════════════════════════════════════
  丢弃式原型 · 06-网页端核心记录流程原型（wayfinder 票）
  问题：「MVP 四个核心流程（今日 / 记一餐 / 记身体数据 / 目标设定）
        长什么样、怎么用」——三个结构不同的界面方案供挑选。
  形态：单文件 HTML，双击在浏览器打开即用；无持久化（内存数据，
        刷新即还原）。三个变体经 ?variant=A|B|C 切换，底部浮条 +
        ←/→ 方向键均可。原型验证后整体废弃，不进实现。
  变体：A「圆环·手机风」— 大圆环主视觉 + 底部标签栏（移动 App 心智）
        B「清单·桌面风」— 侧边导航 + 高密度列表（桌面网页心智）
        C「时间线·手账风」— 单列纵向日志流 + 悬浮添加按钮（日记心智）
  规则来源：04 号票（数据模型/流程）+ 05 号票（热量预算与安全规则：
  速率上限 1kg/周拒存、硬下限女1200/男1500 拒存、低于 BMR 黄警）。
  ═══════════════════════════════════════════════════════════════
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>减脂助手 · 核心流程原型（丢弃式）</title>
<style>
  :root{
    --ink:#1f2430; --sub:#6b7280; --line:#e5e7eb; --bg:#f4f5f7;
    --green:#16a34a; --amber:#d97706; --red:#dc2626; --blue:#2563eb;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif; color:var(--ink); background:var(--bg); min-height:100vh;}
  button{font-family:inherit; cursor:pointer;}
  input,select{font-family:inherit; font-size:15px; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:#fff; width:100%;}
  input:focus,select:focus{outline:2px solid var(--blue); outline-offset:1px;}

  /* ── 丢弃式原型横幅 & 变体浮条（非被评审设计的一部分）── */
  .proto-banner{position:fixed; top:0; left:0; right:0; z-index:90; background:#111827; color:#fbbf24; font-size:12px; text-align:center; padding:4px 8px;}
  .proto-switch{position:fixed; bottom:14px; left:50%; transform:translateX(-50%); z-index:95;
    display:flex; align-items:center; gap:10px; background:#111827; color:#fff; padding:8px 14px; border-radius:999px;
    box-shadow:0 6px 24px rgba(0,0,0,.35); font-size:14px;}
  .proto-switch button{background:#374151; color:#fff; border:none; border-radius:50%; width:30px; height:30px; font-size:15px;}
  .proto-switch button:hover{background:#4b5563;}
  .proto-state{position:fixed; bottom:60px; right:12px; z-index:94; max-width:340px; max-height:45vh; overflow:auto;
    background:#111827ee; color:#d1fae5; font-size:11px; line-height:1.6; padding:10px 12px; border-radius:10px; display:none; white-space:pre-wrap;}
  .proto-state-toggle{position:fixed; bottom:14px; right:12px; z-index:95; background:#374151; color:#fff; border:none; border-radius:8px; padding:6px 10px; font-size:12px;}
  main{padding-top:26px; padding-bottom:80px;}

  /* ── 通用小组件 ── */
  .chip{display:inline-flex; align-items:center; gap:4px; border:1px solid var(--line); background:#fff; border-radius:999px; padding:5px 12px; font-size:13px;}
  .chip.on{background:#dbeafe; border-color:var(--blue); color:var(--blue); font-weight:600;}
  .btn{border:none; border-radius:10px; padding:10px 16px; font-size:15px; font-weight:600;}
  .btn.primary{background:var(--green); color:#fff;}
  .btn.primary:hover{background:#15803d;}
  .btn.ghost{background:#eef2f7; color:var(--ink);}
  .btn:disabled{opacity:.4; cursor:not-allowed;}
  .warn-box{border-radius:10px; padding:10px 12px; font-size:13px; line-height:1.5; margin-top:8px;}
  .warn-box.yellow{background:#fef3c7; color:#92400e; border:1px solid #fcd34d;}
  .warn-box.red{background:#fee2e2; color:#991b1b; border:1px solid #fca5a5;}
  .ok-box{background:#dcfce7; color:#166534; border:1px solid #86efac; border-radius:10px; padding:10px 12px; font-size:13px; margin-top:8px;}
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:13px; color:var(--sub); margin-bottom:4px;}
  .muted{color:var(--sub); font-size:12px;}
  .num{font-variant-numeric:tabular-nums;}

  /* ════════ 变体 A：圆环 · 手机风 ════════ */
  .vA{max-width:430px; margin:0 auto; background:#fff; min-height:calc(100vh - 26px); box-shadow:0 0 40px rgba(0,0,0,.06);}
  .vA-top{padding:16px 18px 6px;}
  .vA-tabs{position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:430px;
    display:flex; background:#fff; border-top:1px solid var(--line); z-index:80;}
  .vA-tabs button{flex:1; background:none; border:none; padding:10px 0 14px; font-size:12px; color:var(--sub);}
  .vA-tabs button.on{color:var(--green); font-weight:700;}
  .vA-tabs button span{display:block; font-size:20px;}
  .ring-wrap{display:flex; flex-direction:column; align-items:center; padding:8px 0 4px;}
  .ring{position:relative; width:190px; height:190px;}
  .ring svg{transform:rotate(-90deg);}
  .ring .ring-txt{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;}
  .ring .ring-txt b{font-size:34px;}
  .vA-meals{padding:6px 18px 90px;}
  .vA-meal{border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin-bottom:10px;}
  .vA-meal h4{font-size:14px; display:flex; justify-content:space-between; margin-bottom:6px;}
  .vA-entry{display:flex; justify-content:space-between; font-size:13px; color:#374151; padding:3px 0 3px 10px;}
  .vA-actions{display:flex; gap:8px; padding:0 18px 10px;}

  /* ════════ 变体 B：清单 · 桌面风 ════════ */
  .vB{display:flex; min-height:calc(100vh - 26px); background:var(--bg);}
  .vB-side{width:210px; background:#1f2937; color:#d1d5db; padding:18px 10px; flex-shrink:0;}
  .vB-side h1{color:#fff; font-size:17px; padding:0 10px 14px;}
  .vB-side button{display:block; width:100%; text-align:left; background:none; border:none; color:#d1d5db; padding:10px 12px; border-radius:8px; font-size:14px; margin-bottom:2px;}
  .vB-side button.on{background:#374151; color:#fff; font-weight:600;}
  .vB-main{flex:1; padding:20px 26px; max-width:860px;}
  .vB-cards{display:flex; gap:12px; margin-bottom:16px; flex-wrap:wrap;}
  .vB-card{background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px 18px; flex:1; min-width:150px;}
  .vB-card .k{font-size:12px; color:var(--sub);}
  .vB-card .v{font-size:26px; font-weight:700; margin-top:2px;}
  table.vB-tbl{width:100%; border-collapse:collapse; background:#fff; border:1px solid var(--line); border-radius:12px; overflow:hidden; font-size:13px;}
  .vB-tbl th{background:#f9fafb; text-align:left; padding:8px 12px; font-weight:600; color:var(--sub); font-size:12px;}
  .vB-tbl td{padding:8px 12px; border-top:1px solid var(--line);}

  /* ════════ 变体 C：时间线 · 手账风 ════════ */
  .vC{max-width:520px; margin:0 auto; padding:18px 20px 110px;}
  .vC h2{font-size:20px; margin-bottom:2px;}
  .vC .sub{color:var(--sub); font-size:13px; margin-bottom:16px;}
  .vC-block{border-left:3px solid var(--line); padding:2px 0 18px 16px; margin-left:6px; position:relative;}
  .vC-block::before{content:""; position:absolute; left:-8px; top:8px; width:13px; height:13px; border-radius:50%; background:#fff; border:3px solid var(--green);}
  .vC-block.meal::before{border-color:var(--blue);}
  .vC-block.body::before{border-color:#a855f7;}
  .vC-block h4{font-size:14px; margin-bottom:6px;}
  .vC-block .row{display:flex; justify-content:space-between; font-size:13px; padding:2px 0;}
  .vC-fab{position:fixed; bottom:64px; right:24px; width:54px; height:54px; border-radius:50%; background:var(--green); color:#fff; font-size:26px; border:none; box-shadow:0 6px 18px rgba(22,163,74,.4); z-index:80;}

  /* ── 弹层（记一餐 / 记身体 / 目标在各变体内复用弹层容器，布局样式随变体）── */
  .overlay{position:fixed; inset:0; background:rgba(15,23,42,.45); z-index:85; display:flex; align-items:flex-end; justify-content:center;}
  .overlay.center{align-items:center;}
  .sheet{background:#fff; border-radius:18px 18px 0 0; width:100%; max-width:520px; max-height:86vh; overflow:auto; padding:18px 20px 24px;}
  .overlay.center .sheet{border-radius:16px; max-width:460px; margin:0 16px;}
  .sheet h3{font-size:16px; margin-bottom:12px;}
  .food-list{max-height:220px; overflow:auto; border:1px solid var(--line); border-radius:10px; margin-top:8px;}
  .food-item{display:flex; justify-content:space-between; padding:9px 12px; font-size:14px; border-bottom:1px solid var(--line); cursor:pointer;}
  .food-item:hover{background:#f0fdf4;}
  .food-item.on{background:#dcfce7; font-weight:600;}
  .portion-row{display:flex; gap:6px; flex-wrap:wrap; margin-top:6px;}
  .slot-row{display:flex; gap:6px; flex-wrap:wrap;}
  .x-close{float:right; background:none; border:none; font-size:18px; color:var(--sub);}
  .tray{border:1px dashed #86efac; background:#f0fdf4; border-radius:10px; padding:8px 10px; margin-bottom:10px;}
  .tray-row{display:flex; justify-content:space-between; align-items:center; font-size:13px; padding:3px 0;}
  .tray-row.tray-sum{border-top:1px solid #bbf7d0; margin-top:4px; padding-top:6px;}
  .tray-x{background:none; border:none; color:var(--red); font-size:13px; padding:0 4px;}
</style>
</head>
<body>
<div class="proto-banner">丢弃式原型 · 仅用于挑选界面方案 · 数据是假的，刷新即还原</div>
<main id="app"></main>

<div class="proto-switch">
  <button id="sw-prev" title="上一个变体">←</button>
  <span id="sw-label">A — 圆环·手机风</span>
  <button id="sw-next" title="下一个变体">→</button>
</div>
<button class="proto-state-toggle" id="sw-state">📦 原型状态</button>
<div class="proto-state" id="state-box"></div>

<script>
/* ══════════ 内存状态（04 号票六实体的原型简化版；无持久化）══════════ */
const state = {
  profile: { sex:'女', birthYear:1995, height:165, activityKey:'light', prefs:'不吃香菜' },
  goal:    { targetWeight:65, rate:0.5 },          // 当前目标版本（原型只有一版）
  goalClosed: [],                                   // 封存的历史目标版本
  measurements: [                                   // 统一测量表：{date,type,value}
    { date:'2026-02-11', type:'weight', value:70.4 },
    { date:'2026-02-12', type:'weight', value:70.2 },
    { date:'2026-02-13', type:'weight', value:70.0 },
    { date:'2026-02-12', type:'bodyfat', value:28.5 },
    { date:'2026-02-12', type:'waist', value:82 },
  ],
  library: [                                        // 食物库（内置精选的抽样）
    { id:1,  name:'米饭',        kcal:116, unit:'份', grams:200 },
    { id:2,  name:'馒头',        kcal:223, unit:'个', grams:100 },
    { id:3,  name:'鸡蛋（煮）',  kcal:144, unit:'个', grams:55 },
    { id:4,  name:'纯牛奶',      kcal:54,  unit:'杯', grams:250 },
    { id:5,  name:'鸡胸肉',      kcal:133, unit:'份', grams:150 },
    { id:6,  name:'红烧肉',      kcal:478, unit:'份', grams:100 },
    { id:7,  name:'清炒西兰花',  kcal:36,  unit:'份', grams:200 },
    { id:8,  name:'番茄',        kcal:15,  unit:'个', grams:150 },
    { id:9,  name:'苹果',        kcal:53,  unit:'个', grams:200 },
    { id:10, name:'香蕉',        kcal:93,  unit:'根', grams:150 },
    { id:11, name:'豆浆（无糖）',kcal:31,  unit:'杯', grams:250 },
    { id:12, name:'酸奶（无糖）',kcal:62,  unit:'杯', grams:120 },
    { id:13, name:'面条（煮）',  kcal:110, unit:'碗', grams:250 },
    { id:14, name:'可乐',        kcal:43,  unit:'罐', grams:330 },
    { id:15, name:'拿铁（中杯）',kcal:75,  unit:'杯', grams:350 },
    { id:16, name:'麻辣烫（估算）',kcal:120, unit:'份', grams:400 },
  ],
  entries: [                                        // 今日食物条目（快照复制）
    { slot:'breakfast', name:'纯牛奶', grams:250, kcal:135 },
    { slot:'breakfast', name:'鸡蛋（煮）', grams:55, kcal:79 },
    { slot:'lunch',     name:'米饭', grams:200, kcal:232 },
    { slot:'lunch',     name:'鸡胸肉', grams:150, kcal:200 },
    { slot:'lunch',     name:'清炒西兰花', grams:200, kcal:72 },
  ],
};
const SLOTS = [ ['breakfast','早餐'], ['lunch','午餐'], ['dinner','晚餐'], ['snack','加餐'] ];
const TYPE_LABELS = { weight:'体重', bodyfat:'体脂', waist:'腰围' };
const ACTIVITIES = { sedentary:1.2, light:1.375, moderate:1.55, high:1.725 };
const ACT_LABELS = { sedentary:'久坐（几乎不动）', light:'轻度（每周运动1-3次）', moderate:'中度（每周3-5次）', high:'高（几乎每天）' };
const TODAY = '2026-02-13';

/* ══════════ 05 号票计算链（纯函数，三个变体共用逻辑、不共用布局）══════════ */
function age(){ return 2026 - state.profile.birthYear; }
function bmr(){
  const p = state.profile, w = latestWeight(), a = age();
  return p.sex === '男'
    ? 10*w + 6.25*p.height - 5*a + 5
    : 10*w + 6.25*p.height - 5*a - 161;
}
function latestWeight(){
  const ws = state.measurements.filter(m => m.type==='weight').sort((x,y)=> y.date.localeCompare(x.date));
  return ws.length ? ws[0].value : state.profile.weight;
}
function tdee(){ return bmr() * ACTIVITIES[state.profile.activityKey]; }
function calorieFloor(){ return state.profile.sex === '男' ? 1500 : 1200; }
function budgetFor(rate){ return Math.round(tdee() - rate*1100); }
function currentBudget(){ return budgetFor(state.goal.rate); }
function eatenToday(){ return state.entries.reduce((s,e)=> s + e.kcal, 0); }
/* 目标校验：返回 {ok, level:'red'|'yellow'|'green', msgs:[]} */
function validateGoal(targetWeight, rate){
  const msgs = [], budget = budgetFor(rate), floor = calorieFloor();
  if (rate > 1)              return { ok:false, level:'red', msgs:['每周减重速率不能超过 1 kg——更快减重会流失肌肉且易反弹，请降低速率。'] };
  if (budget < floor)        return { ok:false, level:'red', msgs:[`按此速率每日预算仅 ${budget} kcal，低于安全下限（${state.profile.sex==='男'?'男':'女'}性 ${floor} kcal），无法保存，请降低速率。`] };
  if (budget < bmr())        msgs.push(`预算 ${budget} kcal 已低于你的基础代谢（${Math.round(bmr())} kcal），长期低于基代有风险，请确认。`);
  else                       msgs.push(`每日热量预算约 ${budget} kcal（TDEE ${Math.round(tdee())} − 缺口 ${Math.round(rate*1100)}）。`);
  if (targetWeight >= latestWeight()) msgs.push('目标体重不低于当前体重——这不是减脂目标，确认要这样设吗？');
  return { ok:true, level: budget < bmr() ? 'yellow' : 'green', msgs };
}
function etaDate(rate){
  const loss = latestWeight() - state.goal.targetWeight, days = Math.round(loss / rate * 7);
  const d = new Date(TODAY); d.setDate(d.getDate() + days);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}（约 ${Math.round(days/7)} 周）`;
}
function trendStatus(){
  // 原型演示：最近两周周均对比预期速率
  return { label:'正常', cls:'ok', detail:`实际周均 −0.3 kg ≈ 预期 −${state.goal.rate} kg（±0.25 容差内）` };
}

/* ══════════ 状态面板（规则5：让状态可见）══════════ */
function renderStateBox(){
  document.getElementById('state-box').textContent =
    `profile: ${JSON.stringify(state.profile)}\n` +
    `goal(当前版本): ${JSON.stringify(state.goal)}  封存:${state.goalClosed.length}版\n` +
    `BMR=${Math.round(bmr())}  TDEE=${Math.round(tdee())}  预算=${currentBudget()} kcal\n` +
    `今日已摄入=${eatenToday()} kcal  剩余=${currentBudget()-eatenToday()} kcal\n` +
    `measurements(${state.measurements.length}): ${state.measurements.filter(m=>m.date===TODAY).map(m=>m.type+'='+m.value).join(', ') || '今日无'}`;
}

/* ══════════ 变体框架 ══════════ */
const VARIANTS = [
  { key:'A', name:'圆环·手机风' },
  { key:'B', name:'清单·桌面风' },
  { key:'C', name:'时间线·手账风' },
];
let variant = (new URLSearchParams(location.search).get('variant') || 'A').toUpperCase();
if (!VARIANTS.some(v => v.key === variant)) variant = 'A';
let view = 'today';      // today | body | goal
let overlay = null;      // {type:'food'|'body', ...}

function setVariant(k){
  variant = k; overlay = null;
  try { history.replaceState(null, '', `?variant=${k}`); }
  catch (e) { /* file:// 下浏览器禁止改 URL——不影响内存中的变体切换 */ }
  render();
}
function goto(v){ view = v; overlay = null; render(); }
function render(){
  const app = document.getElementById('app');
  app.innerHTML = variant === 'A' ? renderA() : variant === 'B' ? renderB() : renderC();
  renderOverlay();
  document.getElementById('sw-label').textContent =
    `${variant} — ${VARIANTS.find(v=>v.key===variant).name}`;
  renderStateBox();
}
function renderOverlay(){
  document.getElementById('ov')?.remove();
  if (!overlay) return;
  const el = document.createElement('div');
  el.id = 'ov';
  el.className = 'overlay' + (variant === 'B' ? ' center' : '');
  el.innerHTML = overlay.type === 'food' ? foodSheetHTML()
               : overlay.type === 'goal' ? goalSheetHTML()
               : overlay.type === 'trend' ? trendSheetHTML()
               : bodySheetHTML();
  el.addEventListener('click', e => { if (e.target === el) { overlay = null; render(); } });
  document.body.appendChild(el);
}

/* ══════════ 共用业务动作（各变体按钮都调这些）══════════ */
let foodPick = { foodId:null, grams:'', kcal:'', slot:'lunch', warn:'' };
function pickFood(id){
  const f = state.library.find(x => x.id === id);
  foodPick.foodId = id; foodPick.grams = ''; foodPick.kcal = ''; foodPick.slot = guessSlot();
  foodPick.warn = '';
  refreshOverlay();
}
function guessSlot(){
  const h = 12; // 原型固定演示时间
  return h < 10 ? 'breakfast' : h < 14 ? 'lunch' : h < 21 ? 'dinner' : 'snack';
}
function applyPortion(btn){
  const f = state.library.find(x => x.id === foodPick.foodId);
  if (!f) return;
  foodPick.grams = f.grams;
  foodPick.kcal = Math.round(f.kcal * f.grams / 100);
  refreshOverlay();
}
function recalcKcal(fromKcal){
  const f = state.library.find(x => x.id === foodPick.foodId);
  if (!f) return;
  if (fromKcal){ // 用户改了热量 → 反推克数
    const g = Math.round(parseFloat(foodPick.kcal || 0) / f.kcal * 100);
    foodPick.grams = isNaN(g) ? '' : g;
  } else {
    const g = parseFloat(foodPick.grams || 0);
    foodPick.kcal = isNaN(g) ? '' : Math.round(f.kcal * g / 100);
  }
  refreshOverlay(true);
}
function addEntry(){
  const f = state.library.find(x => x.id === foodPick.foodId);
  const g = parseFloat(foodPick.grams), k = parseFloat(foodPick.kcal);
  if (!f || !g) { foodPick.warn = '请先选择食物并填写克数'; refreshOverlay(); return; }
  foodPick.tray.push({ slot:foodPick.slot, name:f.name, grams:g, kcal:isNaN(k)?Math.round(f.kcal*g/100):k });
  // 入暂存区而不是直接入账——弹层保持打开，可继续添加多种食物
  foodPick.foodId = null; foodPick.grams = ''; foodPick.kcal = ''; foodPick.warn = '';
  refreshOverlay();
}
function removeTrayItem(i){ foodPick.tray.splice(i, 1); refreshOverlay(); }
function finishMeal(){
  state.entries.push(...foodPick.tray);
  foodPick.tray = [];
  overlay = null; render();
}
function bodySheetHTML(){
  return `<div class="sheet">
    <button class="x-close" onclick="closeOv()">✕</button>
    <h3>记身体数据</h3>
    <div class="field"><label>体重（kg）· 今日</label><input id="bf-w" type="number" step="0.1" placeholder="如 69.8"></div>
    <div class="field"><label>体脂率（%，选填）</label><input id="bf-fat" type="number" step="0.1" placeholder="如 27.5"></div>

/* 体重序列：同日多条 → 每日一个日均值（04 号票口径），按日期升序 */
function dailyWeights(){
  const byDate = {};
  state.measurements.filter(m => m.type === 'weight').forEach(m => {
    (byDate[m.date] = byDate[m.date] || []).push(m.value);
  });
  return Object.keys(byDate).sort().map(d => ({
    date: d,
    value: Math.round(byDate[d].reduce((s, v) => s + v, 0) / byDate[d].length * 10) / 10,
    count: byDate[d].length,
  }));
}
function aTrendHTML(){
  const ws = dailyWeights();
  const min = Math.min(...ws.map(w=>w.value)), max = Math.max(...ws.map(w=>w.value));
  const pts = ws.map((w,i)=>{
    const x = 30 + i*(340/(Math.max(ws.length-1,1)));
    const y = 150 - (w.value-min)/((max-min)||1)*110;
    return `${x},${y}`;
  }).join(' ');
  return `<div class="overlay center"><div class="sheet">
    <button class="x-close" onclick="goto('today')">✕</button>
    <h3>体重趋势（日均值口径）</h3>
    <svg width="100%" height="170" viewBox="0 0 400 170">
      <polyline points="${pts}" fill="none" stroke="var(--blue)" stroke-width="2.5"/>
      ${ws.map((w,i)=>{const [x,y]=pts.split(' ')[i].split(',');return `<circle cx="${x}" cy="${y}" r="3.5" fill="var(--blue)"/><text x="${x}" y="${y-9}" font-size="10" text-anchor="middle" fill="#6b7280">${w.value}${w.count>1?'*':''}</text>`;}).join('')}
    </svg>
    <div class="ok-box">${trendStatus().detail}</div>
    <div class="muted">同日多次体重取日均值（带 * 的点当日有多次打卡）；补录任意日期均可用</div>
    <button class="btn ghost" style="width:100%;margin-top:10px" onclick="openBody()">＋ 补记 / 记今天</button>
  </div></div>`;
}

    <h2>2月13日 · 周五</h2><div class="sub">一日一页，像手账一样往下记</div>
    ${blocks.join('')}
    <div style="display:flex;gap:8px;margin-top:6px">
      <button class="btn ghost" onclick="openGoal()">🎯 目标：${state.goal.targetWeight}kg · −${state.goal.rate}/周（改）</button>
    </div>
    <button class="vC-fab" onclick="openFood()" title="记一餐">＋</button>
  </div>`;
}
function openTrend(){
  overlay = { type:'trend' }; render();
}
function trendSheetHTML(){
  const ws = dailyWeights();
  const min = Math.min(...ws.map(w=>w.value)), max = Math.max(...ws.map(w=>w.value));
  const pts = ws.map((w,i)=>{
    const x = 30 + i*(340/(Math.max(ws.length-1,1)));
    const y = 150 - (w.value-min)/((max-min)||1)*110;
    return `${x},${y}`;
  }).join(' ');
  return `<div class="sheet">
    <button class="x-close" onclick="closeOv()">✕</button>
    <h3>体重趋势（日均值口径）</h3>
    <svg width="100%" height="170" viewBox="0 0 400 170">
      <polyline points="${pts}" fill="none" stroke="var(--blue)" stroke-width="2.5"/>
      ${ws.map((w,i)=>{const [x,y]=pts.split(' ')[i].split(',');return `<circle cx="${x}" cy="${y}" r="3.5" fill="var(--blue)"/><text x="${x}" y="${y-9}" font-size="10" text-anchor="middle" fill="#6b7280">${w.value}${w.count>1?'*':''}</text>`;}).join('')}
    </svg>
    <div class="ok-box">${trendStatus().detail}</div>
    <div class="muted">同日多次体重取日均值（带 * 的点当日有多次打卡）；补录任意日期均可用</div>
    <button class="btn ghost" style="width:100%;margin-top:10px" onclick="openBody()">＋ 补记 / 记今天</button>
  </div>`;
}

/* ══════════ 变体浮条（规则4：←/→ 键盘可切，输入框聚焦时不拦截）══════════ */
document.getElementById('sw-prev').onclick = () => cycle(-1);
document.getElementById('sw-next').onclick = () => cycle(1);
function cycle(d){
  const i = VARIANTS.findIndex(v => v.key === variant);
  setVariant(VARIANTS[(i + d + VARIANTS.length) % VARIANTS.length].key);
}
document.addEventListener('keydown', e => {
  if (['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)) return;
  if (e.key === 'ArrowLeft') cycle(-1);
  if (e.key === 'ArrowRight') cycle(1);
});
document.getElementById('sw-state').onclick = () => {
  const b = document.getElementById('state-box');
  b.style.display = b.style.display === 'block' ? 'none' : 'block';
};
render();
</script>
</body>
</html>
